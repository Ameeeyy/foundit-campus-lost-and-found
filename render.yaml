services:
  - type: web
    name: foundit
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace frontend
    startCommand: npm start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: VITE_API_URL
        value: /api
